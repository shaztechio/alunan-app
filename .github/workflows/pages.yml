name: Website

on:
  push:
    branches: [main]
    paths: ['docs/index.html', 'docs/CNAME', 'docs/.nojekyll', 'docs/assets/**', 'tools/build_site.py', 'tools/test_build_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/index.html', 'docs/CNAME', 'docs/.nojekyll', 'docs/assets/**', 'tools/build_site.py', 'tools/test_build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test site assembly
        run: python3 -m unittest discover -s tools -p 'test_build_site.py' -v
      - name: Assemble website
        run: python3 tools/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
